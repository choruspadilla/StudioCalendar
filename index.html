<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio Schedule</title>

<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

<style>

:root{
  --red:#cc2229;
  --text:#000;
  --secondary:#6e6e73;
  --line:#e5e5e7;
  --pill:#f5f5f7;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#fff;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:48px 32px 80px;
}

h1{
  margin:0;
  font-size:96px;
  line-height:.88;
  font-weight:650;
  letter-spacing:-4px;
}

.segment{
  margin-top:40px;
  margin-bottom:60px;
  display:inline-flex;
  background:var(--pill);
  border-radius:999px;
  padding:4px;
}

.segment button{
  border:none;
  background:none;
  cursor:pointer;
  padding:14px 28px;
  border-radius:999px;
  font-size:18px;
  font-weight:600;
}

.segment button.active{
  background:white;
  box-shadow:
    0 1px 2px rgba(0,0,0,.08),
    0 2px 8px rgba(0,0,0,.08);
}

#calendarView{
  display:none;
}

.day-group{
  margin-bottom:48px;
}

.day-label{
  font-size:42px;
  font-weight:650;
  letter-spacing:-1px;
  margin-bottom:16px;
}

.event{
  display:grid;
  grid-template-columns:160px 1fr;
  gap:28px;
  padding:18px 0;
  border-top:1px solid var(--line);
}

.time{
  color:var(--secondary);
  font-weight:600;
  font-size:16px;
}

.title{
  font-size:28px;
  font-weight:650;
  letter-spacing:-0.5px;
}

.range{
  margin-top:6px;
  color:var(--secondary);
  font-size:16px;
}

.fc{
  width:100%;
}

.fc-toolbar{
  margin-bottom:24px !important;
}

.fc-toolbar-title{
  font-size:42px !important;
  font-weight:650 !important;
  letter-spacing:-1px;
}

.fc-button{
  background:var(--red) !important;
  border:none !important;
}

.fc-button:hover{
  opacity:.9;
}

.fc-theme-standard td,
.fc-theme-standard th{
  border:1px solid var(--line);
}

.fc-scrollgrid{
  border:1px solid var(--line) !important;
}

.fc-daygrid-day-number{
  color:#000;
  text-decoration:none;
}

.fc-daygrid-event{
  background:var(--red) !important;
  border:none !important;
  padding:2px 4px;
}

#accent{
  margin-top:40px;
  height:8px;
  background:var(--red);
}

.empty{
  color:var(--secondary);
}

@media(max-width:700px){

  h1{
    font-size:58px;
  }

  .day-label{
    font-size:30px;
  }

  .event{
    grid-template-columns:1fr;
    gap:10px;
  }

  .title{
    font-size:22px;
  }

}

</style>
</head>
<body>

<div class="container">

<h1>Studio<br>Schedule</h1>

<div class="segment">
  <button id="scheduleBtn" class="active">Schedule</button>
  <button id="calendarBtn">Calendar</button>
</div>

<div id="scheduleView"></div>

<div id="calendarView">
  <div id="calendar"></div>
</div>

<div id="accent"></div>

</div>

<script>

const scheduleBtn = document.getElementById('scheduleBtn');
const calendarBtn = document.getElementById('calendarBtn');

const scheduleView = document.getElementById('scheduleView');
const calendarView = document.getElementById('calendarView');

fetch('./events.json')
.then(response => response.json())
.then(events => {

  buildSchedule(events);
  buildCalendar(events);

})
.catch(error => {

  console.error(error);

  scheduleView.innerHTML =
    '<p class="empty">Unable to load events.</p>';

});

function buildSchedule(events){

  if(events.length === 0){

    scheduleView.innerHTML =
      '<p class="empty">No upcoming events.</p>';

    return;
  }

  const grouped = {};

  events
    .sort((a,b)=>new Date(a.start)-new Date(b.start))
    .forEach(event=>{

      const key =
        new Date(event.start).toDateString();

      if(!grouped[key]){
        grouped[key] = [];
      }

      grouped[key].push(event);

    });

  Object.keys(grouped).forEach(day=>{

    const group =
      document.createElement('div');

    group.className = 'day-group';

    const heading =
      document.createElement('div');

    heading.className = 'day-label';

    heading.textContent =
      new Date(day).toLocaleDateString(
        'en-US',
        {
          weekday:'long',
          month:'long',
          day:'numeric'
        }
      );

    group.appendChild(heading);

    grouped[day].forEach(event=>{

      const start =
        new Date(event.start);

      const end =
        new Date(event.end);

      const item =
        document.createElement('div');

      item.className = 'event';

      item.innerHTML = `
        <div class="time">
          ${start.toLocaleTimeString([],{
            hour:'numeric',
            minute:'2-digit'
          })}
        </div>

        <div>
          <div class="title">
            ${event.title}
          </div>

          <div class="range">
            ${start.toLocaleTimeString([],{
              hour:'numeric',
              minute:'2-digit'
            })}
            –
            ${end.toLocaleTimeString([],{
              hour:'numeric',
              minute:'2-digit'
            })}
          </div>
        </div>
      `;

      group.appendChild(item);

    });

    scheduleView.appendChild(group);

  });

}

function buildCalendar(events){

  const calendar =
    new FullCalendar.Calendar(
      document.getElementById('calendar'),
      {
        initialView:'dayGridMonth',
        height:'auto',
        events:events
      }
    );

  calendar.render();

}

scheduleBtn.addEventListener('click',()=>{

  scheduleBtn.classList.add('active');
  calendarBtn.classList.remove('active');

  scheduleView.style.display='block';
  calendarView.style.display='none';

});

calendarBtn.addEventListener('click',()=>{

  calendarBtn.classList.add('active');
  scheduleBtn.classList.remove('active');

  scheduleView.style.display='none';
  calendarView.style.display='block';

});

</script>

</body>
</html>
