<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

<style>

:root{
  --accent:#cc2229;
  --line:#e7e7e7;
  --text:#111;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff;
  color:var(--text);
}

.container{
  max-width:1000px;
  margin:auto;
  padding:40px 24px 80px;
}

h1{
  font-size:96px;
  line-height:.9;
  font-weight:900;
  letter-spacing:-4px;
  margin:0 0 32px;
}

.segment{
  display:inline-flex;
  background:#f2f2f2;
  border-radius:999px;
  padding:4px;
  margin-bottom:48px;
}

.segment button{
  border:none;
  background:transparent;
  padding:12px 22px;
  border-radius:999px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}

.segment button.active{
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.1);
}

.day-group{
  margin-bottom:50px;
}

.day-label{
  font-size:34px;
  font-weight:800;
  margin-bottom:20px;
}

.event{
  display:grid;
  grid-template-columns:140px 1fr;
  gap:24px;
  padding:18px 0;
  border-top:1px solid var(--line);
}

.time{
  font-size:15px;
  font-weight:700;
  color:#666;
}

.title{
  font-size:22px;
  font-weight:700;
}

.range{
  margin-top:5px;
  color:#666;
}

#accent{
  height:8px;
  background:var(--accent);
  margin-top:40px;
}

#calendarView{
  display:none;
}

.fc-toolbar-title{
  font-size:24px !important;
}

.fc-button{
  background:var(--accent) !important;
  border:none !important;
}

.fc-daygrid-event{
  background:var(--accent) !important;
  border:none !important;
}

.empty{
  color:#888;
  font-size:18px;
}

@media(max-width:700px){

  h1{
    font-size:58px;
  }

  .event{
    grid-template-columns:1fr;
    gap:8px;
  }

  .day-label{
    font-size:26px;
  }

}

</style>
</head>

<body>

<div class="container">

<h1>Studio<br>Schedule.</h1>

<div class="segment">
  <button id="scheduleBtn" class="active">Schedule</button>
  <button id="calendarBtn">Calendar</button>
</div>

<div id="scheduleView"></div>

<div id="calendarView">
  <div id="calendar"></div>
</div>

<div id="accent"></div>

</div>

<script>

const scheduleBtn = document.getElementById('scheduleBtn');
const calendarBtn = document.getElementById('calendarBtn');

const scheduleView = document.getElementById('scheduleView');
const calendarView = document.getElementById('calendarView');

fetch('./events.json')
  .then(response => response.json())
  .then(events => {

    buildSchedule(events);
    buildCalendar(events);

  })
  .catch(error => {

    console.error(error);

    scheduleView.innerHTML =
      '<div class="empty">Unable to load schedule data.</div>';

  });

function buildSchedule(events){

  if(events.length === 0){

    scheduleView.innerHTML =
      '<div class="empty">No events scheduled.</div>';

    return;

  }

  const grouped = {};

  events
    .sort((a,b)=>new Date(a.start)-new Date(b.start))
    .forEach(event=>{

      const key = new Date(event.start).toDateString();

      if(!grouped[key]){
        grouped[key] = [];
      }

      grouped[key].push(event);

    });

  Object.keys(grouped).forEach(day=>{

    const group = document.createElement('div');
    group.className = 'day-group';

    const heading = document.createElement('div');
    heading.className = 'day-label';

    heading.textContent =
      new Date(day).toLocaleDateString(
        'en-US',
        {
          weekday:'long',
          month:'long',
          day:'numeric'
        }
      );

    group.appendChild(heading);

    grouped[day].forEach(event=>{

      const start = new Date(event.start);
      const end = new Date(event.end);

      const item = document.createElement('div');
      item.className = 'event';

      item.innerHTML = `
        <div class="time">
          ${start.toLocaleTimeString([], {
            hour:'numeric',
            minute:'2-digit'
          })}
        </div>

        <div>
          <div class="title">${event.title}</div>

          <div class="range">
            ${start.toLocaleTimeString([], {
              hour:'numeric',
              minute:'2-digit'
            })}
            –
            ${end.toLocaleTimeString([], {
              hour:'numeric',
              minute:'2-digit'
            })}
          </div>
        </div>
      `;

      group.appendChild(item);

    });

    scheduleView.appendChild(group);

  });

}

function buildCalendar(events){

  const calendar = new FullCalendar.Calendar(
    document.getElementById('calendar'),
    {
      initialView:'dayGridMonth',
      events:events
    }
  );

  calendar.render();

}

scheduleBtn.addEventListener('click', ()=>{

  scheduleBtn.classList.add('active');
  calendarBtn.classList.remove('active');

  scheduleView.style.display = 'block';
  calendarView.style.display = 'none';

});

calendarBtn.addEventListener('click', ()=>{

  calendarBtn.classList.add('active');
  scheduleBtn.classList.remove('active');

  scheduleView.style.display = 'none';
  calendarView.style.display = 'block';

});

</script>

</body>
</html>
