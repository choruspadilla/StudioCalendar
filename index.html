<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
body { font-family: -apple-system, sans-serif; margin:0; padding:40px; }
h1 { font-size:48px; }
button {
  background:#cc2229;color:white;border:none;
  padding:12px 18px;border-radius:999px;
  font-size:16px;cursor:pointer;
}
#calendar { margin-top:30px; }
#status { margin-top:10px; color:#666; font-size:14px; }
</style>
</head>

<body>

<h1>Studio Schedule</h1>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div id="calendar"></div>
<script>
const msalConfig = {
  auth: {
    clientId: "c0b75d54-181c-48ea-afeb-1329b55a6a33",
    authority: "https://login.microsoftonline.com/b0f2d090-4ae0-46b4-b43d-2e3fd2aadf5f",
    redirectUri: "https://choruspadilla.github.io/StudioCalendar/"
  },
  cache: {
    cacheLocation: "localStorage",
    storeAuthStateInCookie: true
  }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);

const loginRequest = {
  scopes: ["User.Read", "Calendars.Read"]
};

function init() {

  console.log("INIT RUNNING");

  msalInstance.handleRedirectPromise()
    .then(result => {

      console.log("REDIRECT RESULT:", result);

      if (result?.account) {
        msalInstance.setActiveAccount(result.account);
        loadCalendar();
        return;
      }

      const accounts = msalInstance.getAllAccounts();

      if (accounts.length > 0) {
        msalInstance.setActiveAccount(accounts[0]);
        loadCalendar();
      }

    })
    .catch(err => {
      console.error("AUTH ERROR:", err);
    });

}

document.getElementById("loginBtn").onclick = () => {
  console.log("LOGIN CLICK");
  msalInstance.loginRedirect(loginRequest);
};

async function loadCalendar() {
  document.getElementById("status").innerText = "Logged in (token step next)";

  const account = msalInstance.getActiveAccount();
  console.log("ACCOUNT:", account);
}

init();
</script>

</body>
</html>
