<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

<!-- MSAL (loaded early, no race conditions) -->
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: white;
  color: black;
  padding: 40px;
}

h1 {
  font-size: 48px;
  margin-bottom: 20px;
}

button {
  background: #cc2229;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 16px;
  cursor: pointer;
}

#status {
  margin-top: 10px;
  color: #666;
}

#calendar {
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>Studio Schedule</h1>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div id="calendar"></div>

<script>
const status = document.getElementById("status");

function setStatus(msg) {
  console.log(msg);
  status.innerText = msg;
}

setStatus("Waiting for MSAL...");

function waitForMsal() {
  if (window.msal) {
    setStatus("MSAL loaded");
    startApp();
  } else {
    setTimeout(waitForMsal, 100);
  }
}

function startApp() {

  const msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: "c0b75d54-181c-48ea-afeb-1329b55a6a33",
      authority: "https://login.microsoftonline.com/b0f2d090-4ae0-46b4-b43d-2e3fd2aadf5f",
      redirectUri: window.location.href
    },
    cache: {
      cacheLocation: "localStorage"
    }
  });

  document.getElementById("loginBtn").onclick = async () => {
    try {
      setStatus("Starting login...");
      await msalInstance.loginRedirect({
        scopes: ["User.Read", "Calendars.Read"]
      });
    } catch (e) {
      console.error(e);
      setStatus("Login error: " + e.message);
    }
  };

  msalInstance.handleRedirectPromise()
    .then(result => {
      if (result?.account) {
        msalInstance.setActiveAccount(result.account);
        setStatus("Logged in as " + result.account.username);
      } else {
        setStatus("Ready (not signed in)");
      }
    })
    .catch(err => {
      console.error(err);
      setStatus("Auth error");
    });

}

waitForMsal();
</script>

</body>
</html>
