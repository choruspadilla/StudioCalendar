<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
:root{
  --red:#cc2229;
  --text:#000;
  --secondary:#6e6e73;
  --line:#e5e5e7;
  --pill:#f5f5f7;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:#fff;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:48px 32px 80px;
}

h1{
  margin:0;
  font-size:96px;
  line-height:.9;
  font-weight:600;
  letter-spacing:-4px;
}

.segment{
  display:inline-flex;
  margin-top:40px;
  margin-bottom:40px;
  padding:4px;
  background:var(--pill);
  border-radius:999px;
}

.segment button{
  border:none;
  background:none;
  cursor:pointer;
  padding:14px 28px;
  border-radius:999px;
  font-size:18px;
  font-weight:600;
}

.segment button.active{
  background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.08);
}

#calendarView{display:none;}

.day-group{margin-bottom:48px;}

.day-label{
  font-size:40px;
  font-weight:600;
  margin-bottom:16px;
}

.event{
  display:grid;
  grid-template-columns:160px 1fr;
  gap:28px;
  padding:18px 0;
  border-top:1px solid var(--line);
}

.time{color:var(--secondary);}
.title{font-size:28px;font-weight:600;}
.range{color:var(--secondary);margin-top:6px;}

#signinBtn{
  background:var(--red);
  color:#fff;
  border:none;
  padding:14px 22px;
  border-radius:999px;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  margin-top:20px;
}

#status{
  margin-top:10px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>
<div class="container">

<h1>Studio<br>Schedule</h1>

<button id="signinBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div class="segment">
  <button id="scheduleBtn" class="active">Schedule</button>
  <button id="calendarBtn">Calendar</button>
</div>

<div id="scheduleView"></div>
<div id="calendarView"><div id="calendar"></div></div>

</div>

<script>
document.getElementById("signinBtn").onclick = () => {
  alert("Button clicked — JS is working");
};

</script>
</body>
</html>
