<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
body { font-family: -apple-system, sans-serif; margin:0; padding:40px; }
h1 { font-size:48px; }
button {
  background:#cc2229;color:white;border:none;
  padding:12px 18px;border-radius:999px;
  font-size:16px;cursor:pointer;
}
#calendar { margin-top:30px; }
#status { margin-top:10px; color:#666; font-size:14px; }
</style>
</head>

<body>

<h1>Studio Schedule</h1>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div id="calendar"></div>

<script>
const msalConfig = {
  auth: {
    clientId: "c0b75d54-181c-48ea-afeb-1329b55a6a33",
    authority: "https://login.microsoftonline.com/b0f2d090-4ae0-46b4-b43d-2e3fd2aadf5f",
    redirectUri: "https://choruspadilla.github.io/StudioCalendar/"
  }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);

const loginRequest = {
  scopes: ["User.Read", "Calendars.Read"]
};

let calendar;

document.getElementById("loginBtn").onclick = async () => {
  document.getElementById("status").innerText = "Redirecting to Microsoft...";
  await msalInstance.loginRedirect(loginRequest);
};

async function handleAuth() {

  await msalInstance.initialize();

  const result = await msalInstance.handleRedirectPromise();

  if (result && result.account) {
    msalInstance.setActiveAccount(result.account);
  }

  const account = msalInstance.getAllAccounts()[0];

  if (!account) return;

  msalInstance.setActiveAccount(account);

  document.getElementById("status").innerText = "Fetching calendar...";

  const token = await msalInstance.acquireTokenSilent({
    ...loginRequest,
    account
  });

  const start = new Date();
  const end = new Date();
  end.setDate(end.getDate() + 60);

  const res = await fetch(
    `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${start.toISOString()}&endDateTime=${end.toISOString()}`,
    {
      headers: {
        Authorization: `Bearer ${token.accessToken}`
      }
    }
  );

  const data = await res.json();

  const events = data.value.map(e => ({
    title: e.subject,
    start: e.start.dateTime,
    end: e.end.dateTime
  }));

  calendar = new FullCalendar.Calendar(document.getElementById("calendar"), {
    initialView: "dayGridMonth",
    height: "auto",
    events
  });

  calendar.render();

  document.getElementById("status").innerText = "Loaded";
}

handleAuth();
</script>

</body>
</html>
