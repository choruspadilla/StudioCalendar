<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
body { font-family: -apple-system, sans-serif; margin:0; padding:40px; }
h1 { font-size:48px; }
button {
  background:#cc2229;color:white;border:none;
  padding:12px 18px;border-radius:999px;
  font-size:16px;cursor:pointer;
}
#calendar { margin-top:30px; }
#status { margin-top:10px; color:#666; font-size:14px; }
</style>
</head>

<body>

<h1>Studio Schedule</h1>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div id="calendar"></div>

<script>
console.log("SCRIPT LOADED");

window.onload = function () {

  console.log("WINDOW READY");

  const btn = document.getElementById("loginBtn");

  if (!btn) {
    console.log("BUTTON NOT FOUND");
    return;
  }

  btn.addEventListener("click", function () {
    console.log("CLICK FIRED");
    alert("CLICK WORKS");
  });

};
</script>

</body>
</html>
