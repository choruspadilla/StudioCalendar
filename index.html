<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
:root{
  --red:#cc2229;
  --text:#000;
  --secondary:#6e6e73;
  --line:#e5e5e7;
  --pill:#f5f5f7;
}

*{box-sizing:border-box;}

body{
  margin:0;
  background:#fff;
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:48px 32px 80px;
}

h1{
  margin:0;
  font-size:96px;
  line-height:.9;
  font-weight:600;
  letter-spacing:-4px;
}

.segment{
  display:inline-flex;
  margin-top:40px;
  margin-bottom:40px;
  padding:4px;
  background:var(--pill);
  border-radius:999px;
}

.segment button{
  border:none;
  background:none;
  cursor:pointer;
  padding:14px 28px;
  border-radius:999px;
  font-size:18px;
  font-weight:600;
}

.segment button.active{
  background:#fff;
  box-shadow:0 1px 2px rgba(0,0,0,.08),0 2px 8px rgba(0,0,0,.08);
}

#calendarView{display:none;}

.day-group{margin-bottom:48px;}

.day-label{
  font-size:40px;
  font-weight:600;
  margin-bottom:16px;
}

.event{
  display:grid;
  grid-template-columns:160px 1fr;
  gap:28px;
  padding:18px 0;
  border-top:1px solid var(--line);
}

.time{color:var(--secondary);}
.title{font-size:28px;font-weight:600;}
.range{color:var(--secondary);margin-top:6px;}

#signinBtn{
  background:var(--red);
  color:#fff;
  border:none;
  padding:14px 22px;
  border-radius:999px;
  font-weight:600;
  font-size:16px;
  cursor:pointer;
  margin-top:20px;
}

#status{
  margin-top:10px;
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>
<div class="container">

<h1>Studio<br>Schedule</h1>

<button id="signinBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div class="segment">
  <button id="scheduleBtn" class="active">Schedule</button>
  <button id="calendarBtn">Calendar</button>
</div>

<div id="scheduleView"></div>
<div id="calendarView"><div id="calendar"></div></div>

</div>

<script>
const msalConfig = {
  auth: {
    clientId: "c0b75d54-181c-48ea-afeb-1329b55a6a33",
    authority: "https://login.microsoftonline.com/b0f2d090-4ae0-46b4-b43d-2e3fd2aadf5f",
    redirectUri: "https://choruspadilla.github.io/StudioCalendar/"
  }
};

const msalInstance = new msal.PublicClientApplication(msalConfig);

const scopes = ["User.Read", "Calendars.Read"];

let calendar;

/* ---------------- LOGIN ---------------- */

document.getElementById("signinBtn").onclick = () => {
  document.getElementById("status").innerText = "Redirecting to Microsoft login...";
  msalInstance.loginRedirect({ scopes });
};

/* ---------------- INIT ---------------- */

async function init() {
  try {

    await msalInstance.initialize();

    const result = await msalInstance.handleRedirectPromise();

    if (result?.account) {
      msalInstance.setActiveAccount(result.account);
      document.getElementById("status").innerText = "Logged in";
      loadCalendar();
      return;
    }

    const accounts = msalInstance.getAllAccounts();

    if (accounts.length > 0) {
      msalInstance.setActiveAccount(accounts[0]);
      document.getElementById("status").innerText = "Session restored";
      loadCalendar();
    }

  } catch (e) {
    console.error(e);
    document.getElementById("status").innerText = "Init error (check console)";
  }
}

/* ---------------- TOKEN ---------------- */

async function getToken() {
  const account = msalInstance.getActiveAccount();

  return await msalInstance.acquireTokenSilent({
    scopes,
    account
  });
}

/* ---------------- CALENDAR ---------------- */

async function loadCalendar() {

  try {

    const token = await getToken();

    const start = new Date();
    const end = new Date();
    end.setDate(end.getDate() + 60);

    const res = await fetch(
      `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${start.toISOString()}&endDateTime=${end.toISOString()}`,
      {
        headers: {
          Authorization: `Bearer ${token.accessToken}`
        }
      }
    );

    const data = await res.json();

    const events = data.value.map(e => ({
      title: e.subject,
      start: e.start.dateTime,
      end: e.end.dateTime
    }));

    buildSchedule(events);
    buildCalendar(events);

    document.getElementById("signinBtn").style.display = "none";
    document.getElementById("status").innerText = "Calendar loaded";

  } catch (err) {
    console.error(err);
    document.getElementById("status").innerText = "Failed to load calendar";
  }
}

/* ---------------- UI ---------------- */

function buildSchedule(events){

  const container = document.getElementById("scheduleView");
  container.innerHTML = "";

  const grouped = {};

  events.sort((a,b)=>new Date(a.start)-new Date(b.start)).forEach(e=>{
    const k = new Date(e.start).toDateString();
    grouped[k] = grouped[k] || [];
    grouped[k].push(e);
  });

  Object.keys(grouped).forEach(day=>{
    const div = document.createElement("div");
    div.className = "day-group";

    const h = document.createElement("div");
    h.className = "day-label";
    h.textContent = new Date(day).toLocaleDateString("en-US", {
      weekday:"long", month:"long", day:"numeric"
    });

    div.appendChild(h);

    grouped[day].forEach(e=>{
      const s = new Date(e.start);

      const row = document.createElement("div");
      row.className = "event";

      row.innerHTML = `
        <div class="time">${s.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}</div>
        <div>
          <div class="title">${e.title}</div>
          <div class="range">
            ${s.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}
            –
            ${new Date(e.end).toLocaleTimeString([], {hour:'numeric', minute:'2-digit'})}
          </div>
        </div>
      `;

      div.appendChild(row);
    });

    container.appendChild(div);
  });
}

function buildCalendar(events){
  calendar = new FullCalendar.Calendar(
    document.getElementById("calendar"),
    {
      initialView: "dayGridMonth",
      height: "auto",
      events
    }
  );
  calendar.render();
}

/* ---------------- TOGGLE ---------------- */

document.getElementById("scheduleBtn").onclick = () => {
  scheduleBtn.classList.add("active");
  calendarBtn.classList.remove("active");
  scheduleView.style.display = "block";
  calendarView.style.display = "none";
};

document.getElementById("calendarBtn").onclick = () => {
  calendarBtn.classList.add("active");
  scheduleBtn.classList.remove("active");
  scheduleView.style.display = "none";
  calendarView.style.display = "block";
};

/* ---------------- START ---------------- */

init();

</script>
</body>
</html>
