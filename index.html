<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

<!-- MSAL (loaded early, no race conditions) -->
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background: white;
  color: black;
  padding: 40px;
}

h1 {
  font-size: 48px;
  margin-bottom: 20px;
}

button {
  background: #cc2229;
  color: white;
  border: none;
  padding: 12px 18px;
  border-radius: 999px;
  font-size: 16px;
  cursor: pointer;
}

#status {
  margin-top: 10px;
  color: #666;
}

#calendar {
  margin-top: 30px;
}
</style>
</head>

<body>

<h1>Studio Schedule</h1>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div id="calendar"></div>

<script>
window.addEventListener("load", () => {

  const status = document.getElementById("status");

  function log(msg) {
    console.log(msg);
    status.innerText = msg;
  }

  log("Initializing...");

  const msalConfig = {
    auth: {
      clientId: "c0b75d54-181c-48ea-afeb-1329b55a6a33",
      authority: "https://login.microsoftonline.com/b0f2d090-4ae0-46b4-b43d-2e3fd2aadf5f",
      redirectUri: window.location.href
    },
    cache: {
      cacheLocation: "localStorage"
    }
  };

  const msalInstance = new msal.PublicClientApplication(msalConfig);

  const loginRequest = {
    scopes: ["User.Read", "Calendars.Read"]
  };

  async function initAuth() {

    try {

      await msalInstance.initialize();

      const result = await msalInstance.handleRedirectPromise();

      if (result?.account) {
        msalInstance.setActiveAccount(result.account);
        loadCalendar();
        return;
      }

      const accounts = msalInstance.getAllAccounts();

      if (accounts.length > 0) {
        msalInstance.setActiveAccount(accounts[0]);
        loadCalendar();
      }

    } catch (e) {
      console.error(e);
      log("Auth init error");
    }
  }

  document.getElementById("loginBtn").addEventListener("click", async () => {

    try {
      log("Redirecting to Microsoft...");
      await msalInstance.loginRedirect(loginRequest);
    } catch (e) {
      console.error(e);
      log("Login error");
    }

  });

  async function getToken() {

    const account = msalInstance.getActiveAccount();

    return await msalInstance.acquireTokenSilent({
      ...loginRequest,
      account
    });

  }

  async function loadCalendar() {

    try {

      log("Loading calendar...");

      const token = await getToken();

      const start = new Date();
      const end = new Date();
      end.setDate(end.getDate() + 60);

      const res = await fetch(
        `https://graph.microsoft.com/v1.0/me/calendarView?startDateTime=${start.toISOString()}&endDateTime=${end.toISOString()}`,
        {
          headers: {
            Authorization: `Bearer ${token.accessToken}`
          }
        }
      );

      const data = await res.json();

      const events = data.value.map(e => ({
        title: e.subject,
        start: e.start.dateTime,
        end: e.end.dateTime
      }));

      new FullCalendar.Calendar(document.getElementById("calendar"), {
        initialView: "dayGridMonth",
        height: "auto",
        events
      }).render();

      log("Calendar loaded");

      document.getElementById("loginBtn").style.display = "none";

    } catch (e) {
      console.error(e);
      log("Calendar load failed");
    }

  }

  initAuth();

});
</script>

</body>
</html>
