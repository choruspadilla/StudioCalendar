<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>

<style>
body { font-family: -apple-system, sans-serif; margin:0; padding:40px; }
h1 { font-size:48px; }
button {
  background:#cc2229;color:white;border:none;
  padding:12px 18px;border-radius:999px;
  font-size:16px;cursor:pointer;
}
#calendar { margin-top:30px; }
#status { margin-top:10px; color:#666; font-size:14px; }
</style>
</head>

<body>

<h1>Studio Schedule</h1>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="status"></div>

<div id="calendar"></div>
<script>
console.log("SCRIPT STARTED");

document.getElementById("loginBtn").addEventListener("click", async () => {
  console.log("BUTTON CLICKED");

  if (!window.msal) {
    alert("MSAL NOT LOADED");
    return;
  }

  alert("MSAL EXISTS - TRYING LOGIN");

  try {
    const msalInstance = new msal.PublicClientApplication({
      auth: {
        clientId: "c0b75d54-181c-48ea-afeb-1329b55a6a33",
        authority: "https://login.microsoftonline.com/b0f2d090-4ae0-46b4-b43d-2e3fd2aadf5f",
        redirectUri: window.location.href
      }
    });

    await msalInstance.loginPopup({
      scopes: ["User.Read", "Calendars.Read"]
    });

    alert("LOGIN SUCCESS");

  } catch (e) {
    console.error(e);
    alert("LOGIN ERROR: " + e.message);
  }
});
</script>

</body>
</html>
