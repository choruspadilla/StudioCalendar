<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Studio Schedule</title>

<link href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.17/index.global.min.js"></script>

<!-- ✅ MORE RELIABLE MSAL CDN (fixes your issue) -->
<script src="https://unpkg.com/@azure/msal-browser@2.38.3/lib/msal-browser.min.js"></script>

<style>
body { margin:0; font-family: -apple-system, sans-serif; padding:40px; }
h1 { font-size:48px; }
button {
  background:#cc2229;color:white;border:none;
  padding:12px 18px;border-radius:999px;
  font-size:16px;cursor:pointer;
}
#status { margin-top:10px; color:#666; }
</style>
</head>

<body>

<h1>Studio Schedule</h1>

<button id="loginBtn">Sign in with Microsoft</button>
<div id="status">Loading...</div>

<div id="calendar"></div>

<script>
const statusEl = document.getElementById("status");

function status(msg){
  console.log(msg);
  statusEl.innerText = msg;
}

/* ----------------------------------------
   HARD CHECK: MSAL LOADING
---------------------------------------- */
setTimeout(() => {

  if (!window.msal) {
    status("MSAL failed to load (CDN blocked). Trying fallback...");

    // fallback CDN injection
    const script = document.createElement("script");
    script.src = "https://cdn.jsdelivr.net/npm/@azure/msal-browser@2.38.3/lib/msal-browser.min.js";

    script.onload = initApp;
    script.onerror = () => status("MSAL blocked completely on this network");

    document.head.appendChild(script);

  } else {
    initApp();
  }

}, 500);

/* ----------------------------------------
   APP START
---------------------------------------- */
function initApp() {

  status("MSAL loaded");

  const msalInstance = new msal.PublicClientApplication({
    auth: {
      clientId: "c0b75d54-181c-48ea-afeb-1329b55a6a33",
      authority: "https://login.microsoftonline.com/b0f2d090-4ae0-46b4-b43d-2e3fd2aadf5f",
      redirectUri: window.location.href
    },
    cache: {
      cacheLocation: "localStorage"
    }
  });

  const loginRequest = {
    scopes: ["User.Read", "Calendars.Read"]
  };

  document.getElementById("loginBtn").onclick = async () => {
    try {
      status("Redirecting to Microsoft...");
      await msalInstance.loginRedirect(loginRequest);
    } catch (e) {
      console.error(e);
      status("Login error: " + e.message);
    }
  };

  msalInstance.handleRedirectPromise()
    .then(result => {
      if (result?.account) {
        msalInstance.setActiveAccount(result.account);
        status("Logged in: " + result.account.username);
      } else {
        status("Ready (not signed in)");
      }
    })
    .catch(err => {
      console.error(err);
      status("Auth error");
    });

}
</script>

</body>
</html>
